name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No data, weights, archives or secrets are tracked
        run: |
          bad=$(git ls-files | grep -E '\.(pt|pth|ckpt|onnx|tar|tgz|zip|key|pem)$|\.tar\.gz$|(^|/)\.env$' || true)
          if [ -n "$bad" ]; then echo "tracked forbidden files:"; echo "$bad"; exit 1; fi
          big=$(git ls-files -z | xargs -0 du -k | awk '$1 > 5000' || true)
          if [ -n "$big" ]; then echo "tracked files over 5 MB:"; echo "$big"; exit 1; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: ruff check .
      - run: python -m pytest -q
